<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Sample.BlazorWasm</title>
        <!--
            Where the app is served: at the root (dotnet run, the DevServer) and under /blazor-wasm/ (Sample.AppHost's Blazor gateway). The
            pages under rockets/ are more than one segment deep, so the base is the path before the first segment of a route, set here before
            anything relative to it loads. The links of the pages are relative to it.
        -->
        <base href="./" />
        <script>
            document.querySelector('base').setAttribute('href', location.pathname.replace(/\/(?:rockets|counter|fetchdata)(?:\/.*)?$/, '/'));
        </script>
        <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
        <link href="css/app.css" rel="stylesheet" />
    </head>

    <body>
        <app>Loading...</app>

        <div id="blazor-error-ui">
            An unhandled error has occurred.
            <a href="" class="reload">Reload</a>
            <a class="dismiss">🗙</a>
        </div>
        <script src="_framework/blazor.webassembly.js"></script>
    </body>
</html>
