<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Sample.BlazorWasm</title>
        <!--
            Relative, so the app works where it is served: at the root (dotnet run, the DevServer) and under /blazor-wasm/ (Sample.AppHost's
            Blazor gateway). The pages are all one segment deep, so the base of any of them is the app's root.
        -->
        <base href="./" />
        <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
        <link href="css/app.css" rel="stylesheet" />
    </head>

    <body>
        <app>Loading...</app>

        <div id="blazor-error-ui">
            An unhandled error has occurred.
            <a href="" class="reload">Reload</a>
            <a class="dismiss">🗙</a>
        </div>
        <script src="_framework/blazor.webassembly.js"></script>
    </body>
</html>
