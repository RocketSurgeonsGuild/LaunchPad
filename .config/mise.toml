[tools]
# The SDK comes first: Renovate's custom managers (.github/renovate.json) read the first entry as the SDK and the runtime entry separately.
# The ASP.NET Core runtime carries the .NET runtime too, so the net10.0 web tests run on ASP.NET Core 10 rather than rolling forward to 11.
dotnet = [
  { version = "11.0.100" },
  { version = "10.0.15", runtime = "aspnetcore" },
]
"github:microsoft/apm" = { version = "v0.35.1", bin = "apm" }
"github:eljulians/skillfile" = { version = "v1.9.2", bin = "skillfile" }
hk = "2.12.0"
pkl = "0.33.0"
node = "26.13.1"
actionlint = "1.7.12"
biome = "2.5.2"

"dotnet:gitversion.tool" = "6.6.0"
"dotnet:dotnet-reportgenerator-globaltool" = "5.5.3"
"dotnet:codecov.tool" = "1.13.0"
"dotnet:jetbrains.resharper.globaltools" = "2025.3.3"
"dotnet:jetbrains.dotcover.commandlinetools" = "2025.3.3"
"dotnet:jetbrains.dottrace.globaltools" = "2025.3.3"
"dotnet:dotnet-coverage" = "18.5.1"
"dotnet:dotnet-outdated-tool" = "4.7.0"
"dotnet:verify.tool" = "0.7.0"
"dotnet:gitreleasemanager.tool" = "0.20.0"
"dotnet:NuGet.Mcp.Server" = "1.4.3"
tombi = "1.11.2"
oxfmt = "0.75.0"

[tasks]
build = { run = "dotnet run build/Build.cs" }
"docs:api" = { run = "api-reference --solution LaunchPad.slnx --output docs/src/data/api", tools = { "dotnet:Rocket.Surgery.ApiReference" = "0.1.14" }, description = "Generate the C# API reference JSON (docs/src/data/api) from the Release build output: build first (mise run build, or dotnet build LaunchPad.slnx -c Release)" }
docs = { run = [
  "dotnet build LaunchPad.slnx -c Release",
  "mise run docs:api",
  "npm run dev --workspace docs",
], description = "Build the solution, generate the API reference and start the Astro/Starlight dev server" }
"docs:preview" = { run = "npm run preview --workspace docs", description = "Preview built Starlight site" }
"docs:build" = { run = "npm run build --workspace docs", depends = [
  "docs:api",
], description = "Build the Starlight site (the API reference JSON comes from the docs:api task, so build the solution first)" }
"roslyn-lsp" = { run = "bash build/scripts/install-roslyn-lsp.sh", description = "Install the Microsoft Roslyn language server for this RID" }
"pkl-vscode" = { run = "bash build/scripts/install-pkl-vscode.sh", description = "Install the Pkl VS Code extension (not in marketplace; installed from VSIX)" }

[settings]
experimental = true
prereleases = true

[env]
HK_MISE = 1
# StrawberryShake.Server runs its code generator (tools/net9/dotnet-graphql.dll, Sample.Graphql.Tests) on .NET 9, which mise does not
# install; this lets it run on the .NET 10 runtime. Everything else targets net10.0 or net11.0 and finds its own runtime.
DOTNET_ROLL_FORWARD = "Major"
npm_config_cache = "{{env.HOME}}/.local/share/mise/npm-cache"
# Microsoft Roslyn language server (Microsoft.CodeAnalysis.LanguageServer), installed by the
# `roslyn-lsp` task from the Azure DevOps vs-impl feed. The wrapper lands on PATH below.
ROSLYN_LSP_VERSION = "4.8.0-7.26274.14"
PKL_VSCODE_VERSION = "0.22.0"

[deps.npm]
auto = true
