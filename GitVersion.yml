workflow: GitHubFlow/v1
semantic-version-format: Loose

branches:
    main:
        label: beta
        source-branches:
            - next
    pull-request:
        mode: ContinuousDelivery
        label: pr
        source-branches:
            - main
            - feature
    # GitHub's merge queue tests a branch named gh-readonly-queue/main/pr-<number>-<sha>; left to the default label, the whole name goes
    # into the version and the package paths outgrow NuGet's limit (NU5123).
    merge-queue:
        regex: ^gh-readonly-queue/
        mode: ContinuousDelivery
        label: queue
        increment: Inherit
        source-branches:
            - main
    next:
        mode: ContinuousDelivery
        regex: ^next$
        increment: Major
        label: next
